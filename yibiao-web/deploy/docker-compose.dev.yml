name: yibiao-dev

services:
  postgres:
    image: postgres:17-alpine
    container_name: yibiao-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: yibiao
      POSTGRES_PASSWORD: yibiao_dev_pwd
      POSTGRES_DB: yibiao
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=512MB
      - -c
      - work_mem=16MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yibiao -d yibiao"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 1g

  # 对象存储：S3 兼容，存放用户资产（个人资产库）
  # 独立实例，不与其他项目的 RustFS 混用，避免数据互相影响
  rustfs:
    image: rustfs/rustfs:latest
    container_name: yibiao-dev-rustfs
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: yibiao_admin
      RUSTFS_SECRET_KEY: yibiao_rustfs_dev_secret_2026
      TZ: Asia/Shanghai
    ports:
      # 只监听回环：容器间通过服务名访问，宿主机可调试，公网访问不到
      - "127.0.0.1:9010:9000"
      - "127.0.0.1:9011:9001"
    volumes:
      - rustfs_data:/data
    command:
      - "server"
      - "--address"
      - "0.0.0.0:9000"
      - "--console-enable"
      - "--console-address"
      - "0.0.0.0:9001"
      - "/data"
    mem_limit: 512m

  dev:
    image: yibiao-dev:latest
    container_name: yibiao-dev-workspace
    restart: unless-stopped
    working_dir: /workspace
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5180:5173"
      - "8090:8080"
      - "9222:9222"
    volumes:
      - ./workspace:/workspace
      - go_mod:/go/pkg/mod
      - go_cache:/root/.cache/go-build
      - npm_cache:/root/.npm
      - nuget_cache:/root/.nuget
    environment:
      TZ: Asia/Shanghai
      DATABASE_URL: postgres://yibiao:yibiao_dev_pwd@postgres:5432/yibiao?sslmode=disable
      PUBLIC_BASE_URL: http://<SERVER_IP>:5180
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "1"
      # 对象存储（S3 兼容）
      S3_ENDPOINT: http://rustfs:9000
      S3_ACCESS_KEY: yibiao_admin
      S3_SECRET_KEY: yibiao_rustfs_dev_secret_2026
      S3_BUCKET: yibiao-assets
      S3_REGION: us-east-1
    command: ["sleep", "infinity"]
    mem_limit: 3g

volumes:
  pgdata:
  rustfs_data:
  go_mod:
  go_cache:
  npm_cache:
  nuget_cache:
